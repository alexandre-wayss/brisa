name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Brisa
        run: cd Brisa && ./Scripts/build.sh
      - name: Create DMG
        run: cd Brisa && ./Scripts/package-dmg.sh
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Brisa/release/Brisa-macOS-arm64.dmg
