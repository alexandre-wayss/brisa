name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${version}" Brisa/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" Brisa/Info.plist
      - name: Build Brisa
        run: cd Brisa && ./Scripts/build.sh
      - name: Create DMG
        run: cd Brisa && ./Scripts/package-dmg.sh
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Brisa/release/Brisa-macOS-arm64.dmg
