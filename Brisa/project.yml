name: Brisa
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Brisa:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets/Brisa.icns
        buildPhase: resources
    postBuildScripts:
      - name: Copy Brisa audio library
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp -R "$SRCROOT/Resources/Audio" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Audio"
          cp "$SRCROOT/Resources/CREDITOS-AUDIO.md" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/CREDITOS-AUDIO.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.brisa.ambient
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
