name: Brisa
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Brisa:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets/Brisa.icns
        buildPhase: resources
    postBuildScripts:
      - name: Copy Brisa audio library
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp -R "$SRCROOT/Resources/Audio" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Audio"
          cp "$SRCROOT/Resources/CREDITOS-AUDIO.md" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/CREDITOS-AUDIO.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.brisa.ambient
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Brisa.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - target: BrisaWidgets
        embed: true
  BrisaWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets
        excludes:
          - README.md
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.brisa.ambient.widgets
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/BrisaWidgets.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
